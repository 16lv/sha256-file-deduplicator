[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "python-automation-toolkit"
version = "1.3.0"
description = "Content-addressable SHA-256 deduplicator, tabular ETL sanitizer, and SQLite audit ledger"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sha256-dedupe = "automation_toolkit.workflows:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
